<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rapid Roll</title>
<meta name="theme-color" content="#1d2b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rapid Roll">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#c7d9a0;--ink:#1d2b0f;--btn:#2c3a1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#151a10;color:var(--bg);font-family:"Courier New",monospace;overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:bold;font-size:16px}
#hud span{white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;border:4px solid var(--ink);border-radius:6px;box-shadow:0 0 0 2px #3a4a26}
canvas{display:block;background:var(--bg);image-rendering:pixelated}
.ov{position:absolute;inset:0;background:rgba(199,217,160,.94);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:16px}
.ov.hide{display:none}
.ov h1{margin:0;font-size:30px;letter-spacing:2px}
.ov p{margin:0;font-size:13px;line-height:1.45}
.pbtn{background:var(--ink);color:var(--bg);border:0;padding:12px 22px;font:bold 16px "Courier New",monospace;border-radius:6px}
#inst{background:none;color:var(--ink);border:2px solid var(--ink)}
#pad{display:flex;gap:14px;padding:10px 14px 16px;height:116px}
.ctl{flex:1;border:0;border-radius:18px;background:var(--btn);color:var(--bg);font-size:44px;box-shadow:0 6px 0 #0d1208}
.ctl.on{transform:translateY(4px);box-shadow:0 2px 0 #0d1208;background:#41562a}
.sm{background:none;border:2px solid #3a4a26;color:var(--bg);border-radius:6px;padding:2px 8px;font:inherit;margin-left:4px}
</style></head><body>
<div id="app">
 <div id="hud"><span id="sc">SCORE 0</span><span id="lv"></span><span><button class="sm" id="snd">SND</button><button class="sm" id="pz">||</button></span></div>
 <div id="stage"><div id="wrap">
  <canvas id="c" width="320" height="480"></canvas>
  <div class="ov" id="ov"><h1 id="oh"></h1><p id="op"></p><button class="pbtn" id="ob"></button><button class="pbtn hide" id="inst">INSTALL APP</button></div>
 </div></div>
 <div id="pad"><button class="ctl" id="bl" aria-label="Move left">&#9664;</button><button class="ctl" id="br" aria-label="Move right">&#9654;</button></div>
</div>
<script>
const W=320,H=480,CEIL=18,R=9,INK='#1d2b0f',BG='#c7d9a0';
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let st='start',score=0,hi=+store.get('rr_hi')||0,lives=3,speed=1.3,ball,plats=[],inv=0,flash=0,prevT='n',lastT=0,muted=store.get('rr_mute')==='1',ac,nextMile=250;
const keys={l:0,r:0},kb={l:0,r:0};

/* ---------- sound (synthesised, no files needed) ---------- */
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type='square',to=f,v=.12,t0=0){if(muted||!ac)return;const t=ac.currentTime+t0,o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(to,1),t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d)}
const arp=(fs,d,v=.1,gap=.08)=>fs.forEach((f,i)=>tone(f,d,'square',f,v,i*gap));
const SFX={land:()=>tone(420,.08,'square',250),hurt:()=>{tone(220,.35,'sawtooth',60,.2);tone(90,.3,'square',40,.15)},life:()=>arp([523,659,784,1046],.1,.1,.07),crumble:()=>tone(160,.15,'triangle',60,.15),over:()=>arp([400,330,262,196],.25,.12,.18),start:()=>arp([392,523,659],.09),level:()=>arp([880,1100],.06,.06,.06)};

/* ---------- game logic ---------- */
function mk(y,t){return{x:Math.random()*(W-70),y,w:70,t:t||'n',h:0,tm:0}}
function fill(){let ly=Math.max(...plats.map(p=>p.y));while(ly<H+30){ly+=72+Math.random()*28;let t='n';const r=Math.random();if(prevT==='n'){if(r<.2&&score>30)t='s';else if(r<.38&&score>80)t='c'}const p=mk(ly,t);if(t==='n'&&Math.random()<.1)p.h=1;prevT=t;plats.push(p)}}
function reset(){score=0;lives=3;speed=1.3;inv=0;flash=0;nextMile=250;prevT='n';const f=mk(300);f.x=W/2-35;plats=[f];fill();ball={x:W/2,y:300-R,vx:0,vy:0,on:f}}
function respawn(){let b=null;for(const p of plats)if(p.t==='n'&&p.y>100&&p.y<360&&(!b||Math.abs(p.y-220)<Math.abs(b.y-220)))b=p;if(!b){b=mk(200);b.x=W/2-35;plats.push(b)}ball.on=b;ball.x=b.x+b.w/2;ball.y=b.y-R;ball.vx=ball.vy=0}
function hurt(){if(inv>0)return;lives--;inv=90;flash=12;SFX.hurt();navigator.vibrate&&navigator.vibrate(150);if(lives<=0)over()}
function land(p){ball.on=p;ball.y=p.y-R;ball.vy=0;
 if(p.t==='s'){if(!p.hit){p.hit=1;hurt()}}else SFX.land();
 if(p.t==='c'&&!p.tm)p.tm=25;
 if(p.h&&lives<5){p.h=0;lives++;SFX.life()}}
function over(){st='over';const s=Math.floor(score),nb=s>hi;if(nb){hi=s;store.set('rr_hi',hi)}SFX.over();show('GAME OVER','Score: '+s+'<br>Best: '+hi+(nb?'<br>NEW BEST!':''),'PLAY AGAIN',start)}
function update(dt){
 speed=Math.min(1.3+score/700,3.6);const dy=speed*dt;score+=speed*dt/6;
 if(score>=nextMile){nextMile+=250;SFX.level()}
 if(inv>0)inv-=dt;if(flash>0)flash-=dt;
 for(const p of plats){p.y-=dy;if(p.tm>0){p.tm-=dt;if(p.tm<=0){p.gone=1;SFX.crumble()}}}
 plats=plats.filter(p=>p.y>-20&&!p.gone);if(ball.on&&!plats.includes(ball.on))ball.on=null;
 fill();
 const tgt=((keys.r||kb.r)-(keys.l||kb.l))*3.4;ball.vx+=(tgt-ball.vx)*.3*Math.min(dt,2);ball.x=Math.max(R,Math.min(W-R,ball.x+ball.vx*dt));
 if(ball.on){const p=ball.on;if(ball.x<p.x-R*.5||ball.x>p.x+p.w+R*.5)ball.on=null;else{ball.y=p.y-R;ball.vy=0}}
 if(!ball.on){const pb=ball.y+R;ball.vy=Math.min(ball.vy+.35*dt,7);ball.y+=ball.vy*dt;const b=ball.y+R;
  for(const p of plats)if(ball.x>=p.x-R*.5&&ball.x<=p.x+p.w+R*.5&&pb<=p.y+dy+1&&b>=p.y){land(p);break}}
 if(st!=='play')return;
 if(ball.y-R<CEIL||ball.y-R>H){hurt();if(st==='play')respawn()}
}

/* ---------- drawing ---------- */
function tri(a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.fill()}
function draw(){
 g.fillStyle=BG;g.fillRect(0,0,W,H);g.fillStyle='rgba(29,43,15,.07)';for(let y=0;y<H;y+=8)g.fillRect(0,y,W,1);
 g.fillStyle=INK;
 for(const p of plats){let x=Math.round(p.x),y=Math.round(p.y);
  if(p.t==='n'){g.fillRect(x,y,p.w,8);g.fillStyle=BG;g.fillRect(x+3,y+2,p.w-6,1);g.fillStyle=INK}
  else if(p.t==='s'){g.fillRect(x,y+8,p.w,4);for(let i=0;i<p.w;i+=10)tri(x+i,y+8,x+i+5,y,x+i+10,y+8)}
  else{if(p.tm>0)x+=Math.round(Math.sin(p.tm*2)*2);for(let i=0;i<p.w;i+=14)g.fillRect(x+i,y,11,8)}
  if(p.h){g.font='bold 16px monospace';g.textAlign='center';g.fillText('\u2665',p.x+p.w-12,p.y-3)}}
 for(let x=0;x<W;x+=16)tri(x,0,x+16,0,x+8,CEIL);
 if(!(inv>0&&Math.floor(inv/4)%2)){g.beginPath();g.arc(ball.x,ball.y,R,0,7);g.fill();g.fillStyle=BG;g.beginPath();g.arc(ball.x-3,ball.y-3,2.5,0,7);g.fill()}
 if(flash>0){g.fillStyle='rgba(29,43,15,.35)';g.fillRect(0,0,W,H)}
}
let lastHud='';function hud(){const s='SCORE '+Math.floor(score)+'|'+'\u2665'.repeat(lives)+'\u2661'.repeat(5-lives);if(s===lastHud)return;lastHud=s;const a=s.split('|');$('sc').textContent=a[0];$('lv').textContent=a[1]}

/* ---------- flow ---------- */
function show(h,p,b,fn){$('ov').classList.remove('hide');$('oh').textContent=h;$('op').innerHTML=p;$('ob').textContent=b;$('ob').onclick=()=>{A();fn()}}
function start(){A();reset();st='play';$('ov').classList.add('hide');SFX.start()}
function resume(){A();st='play';$('ov').classList.add('hide')}
function pause(){if(st==='play'){st='pause';show('PAUSED','Best: '+hi,'RESUME',resume)}else if(st==='pause')resume()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-lastT)/16.667,2.5)||1;lastT=t;if(st==='play')update(dt);draw();hud()}

/* ---------- controls ---------- */
const ptr=new Map(),bl=$('bl'),br=$('br'),pad=$('pad');
function sync(){keys.l=keys.r=0;ptr.forEach(k=>{if(k)keys[k]=1});bl.classList.toggle('on',!!(keys.l||kb.l));br.classList.toggle('on',!!(keys.r||kb.r))}
function which(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el===bl?'l':el===br?'r':''}
pad.addEventListener('pointerdown',e=>{e.preventDefault();A();ptr.set(e.pointerId,which(e));sync()});
pad.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,which(e));sync()}});
['pointerup','pointercancel'].forEach(v=>pad.addEventListener(v,e=>{ptr.delete(e.pointerId);sync()}));
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')kb.l=1;else if(k==='ArrowRight'||k==='d')kb.r=1;else if(k==='p'||k==='Escape')pause();else if(k==='Enter'&&st!=='play'){$('ob').click()}sync()});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')kb.l=0;if(k==='ArrowRight'||k==='d')kb.r=0;sync()});
$('pz').onclick=pause;
$('snd').onclick=()=>{muted=!muted;store.set('rr_mute',muted?'1':'0');$('snd').textContent=muted?'MUTE':'SND';A();if(!muted)SFX.land()};
$('snd').textContent=muted?'MUTE':'SND';
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')pause()});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- layout + PWA ---------- */
function fit(){const s=$('stage'),k=Math.min((s.clientWidth-16)/W,(s.clientHeight-16)/H);cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').classList.remove('hide')});
$('inst').onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;$('inst').classList.add('hide')}};
addEventListener('appinstalled',()=>$('inst').classList.add('hide'));
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

reset();show('RAPID ROLL','Ride the rising platforms.<br>Avoid the ceiling spikes and spiked platforms.<br>Do not fall off the bottom.<br>Cracked platforms break. &#9829; gives a life.<br>Hold &#9664; &#9654; to roll.','PLAY',start);
requestAnimationFrame(loop);
</script></body></html>
